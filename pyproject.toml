[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-evals"
version = "0.1.0"
description = "PM-friendly eval platform for testing and validating MCP server tools and skills"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0",
    "anthropic>=1.0",
    "openai>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pm-evals = "pm_evals.cli:main"

[tool.setuptools.packages.find]
include = ["pm_evals*"]

[tool.setuptools.package-data]
pm_evals = ["web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
